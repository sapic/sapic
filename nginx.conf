server {
  listen 80;

  # The multithreaded ffmpeg.wasm core needs SharedArrayBuffer, which is only
  # exposed to cross-origin isolated documents. This is site-wide rather than
  # scoped to /converter because the index page converts inline too (a video
  # background opens a converter popup).
  #
  # COEP is 'credentialless' rather than 'require-corp' because the Steam CDNs
  # serve item images with neither CORP nor CORS headers, and require-corp blocks
  # every one of them. credentialless still isolates, but allows those no-cors
  # images through (without credentials, which they do not need).
  #
  # 'always' ensures the headers are also sent on error/fallback responses.
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /converter {
    # This would be the directory where your React app's static files are stored at
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /en {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /ru {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /zh {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /tr {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # Everything under /assets is content-hashed by Vite, so it can be cached
  # forever. Matters most for the ~33MB ffmpeg core wasm.
  location /assets/ {
    root /usr/share/nginx/html;

    # A types block replaces the whole MIME map, so re-include the defaults
    # before adding .asset. The ffmpeg core JS files use that extension so Vite
    # does not transform them (see convert.ts); map them back to JS so they are
    # typed correctly and picked up by gzip.
    include /etc/nginx/mime.types;
    types {
      text/javascript asset;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/javascript application/javascript text/css application/json application/wasm;
    gzip_min_length 1024;

    # A location with its own add_header does not inherit the server-level ones,
    # so they are repeated here. The ffmpeg worker script is emitted into this
    # directory, and a dedicated worker's own script must carry a COEP header
    # matching the document or the browser rejects it and the worker never starts.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    # This would be the directory where your React app's static files are stored at
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
  }
}
